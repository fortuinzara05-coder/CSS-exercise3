<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop - Animated</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading spinner -->
    <div class="loader">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <!-- Animated nav -->
    <nav>
        <h2 class="logo">My Shop 🛒</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero with animated background -->
    <header class="hero">
        <div class="hero-text">
            <h1>Best Deals This Week</h1>
            <p>Up to 50% off on all products</p>
            <button class="cta">Shop Now</button>
        </div>
        <div class="hero-shape"></div>
    </header>

    <!-- 6 products -->
    <main>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" alt="Headphones">
            <h2>Headphones</h2>
            <p class="price">R499.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" alt="Watch">
            <h2>Watch</h2>
            <p class="price">R899.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" alt="Sneakers">
            <h2>Sneakers</h2>
            <p class="price">R1299.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300" alt="Backpack">
            <h2>Backpack</h2>
            <p class="price">R349.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=300" alt="Sunglasses">
            <h2>Sunglasses</h2>
            <p class="price">R299.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=300" alt="Water Bottle">
            <h2>Water Bottle</h2>
            <p class="price">R199.99</p>
            <button>Add to Cart</button>
        </div>
    </main>

</body>
</html>
